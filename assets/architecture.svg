<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="525" viewBox="0 0 1280 525" role="img" aria-labelledby="title desc">
<title id="title">B4Math public architecture diagram</title>
<desc id="desc">A high level five-stage system map: reviewed Company Brain, decision framing, deterministic rehearsal, decision brief, and reviewed learning. Human approval is required before updating company context.</desc>
