<text x="58" y="104" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#112D22">A decision is a traceable process.</text>
<text x="58" y="140" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#53685C">High-level architecture   •   simplified for a public engineering portfolio</text>
